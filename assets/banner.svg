  <text x="64" y="220" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#CBD5E1">Full-stack developer · Estudiante de Análisis de Sistemas</text>
  <text x="64" y="267" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#94A3B8">De la idea al producto, con atención al detalle.</text>
