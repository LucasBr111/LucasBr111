<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="380" viewBox="0 0 1280 380" role="img" aria-labelledby="title desc">
  <title id="title">Lucas | Full-stack developer</title>
  <desc id="desc">Desarrollo web con criterio, de la idea al producto. Banner en azul y negro con una composición geométrica.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0B1120"/><stop offset="1" stop-color="#111D35"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#67E8F9"/><stop offset="1" stop-color="#818CF8"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#3B82F6" stop-opacity=".19"/><stop offset="1" stop-color="#3B82F6" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#A5B4FC" stroke-opacity=".045"/></pattern>
  </defs>
  <rect width="1280" height="380" rx="20" fill="url(#bg)"/>
  <rect width="1280" height="380" rx="20" fill="url(#grid)"/>
